[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://garimpo-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
