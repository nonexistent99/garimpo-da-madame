[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/webhooks/lastlink"
  to = "/.netlify/functions/lastlink-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/overview"
  to = "/.netlify/functions/admin-overview"
  status = 200
  force = true

[[redirects]]
  from = "/api/staff/cpf-lookup"
  to = "/.netlify/functions/staff-cpf-lookup"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://garimpo-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200

[[redirects]]
from = "/consulta"
to = "/consulta.html"
status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
